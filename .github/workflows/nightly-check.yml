name: Nightly Upstream Check

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-upstream:
    name: Check CachyOS Kernel Release
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get current package source tag
        id: current
        run: |
          source ./PKGBUILD

          echo "source_tag=${_srctag}" >> "$GITHUB_OUTPUT"
          echo "version=${pkgver}" >> "$GITHUB_OUTPUT"
          echo "tagrel=${_cachyos_tagrel}" >> "$GITHUB_OUTPUT"
          echo "major_minor=${_major}" >> "$GITHUB_OUTPUT"

          echo "Current CachyOS source tag: ${_srctag}"

      - name: Get latest CachyOS stable release
        id: upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          response="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/CachyOS/linux/releases?per_page=100")"

          latest_tag="$(jq -r '
            [
              .[]
              | select(.draft == false)
              | select(.prerelease == false)
              | .tag_name
              | select(test("^cachyos-[0-9]+\\.[0-9]+\\.[0-9]+-[0-9]+$"))
            ][0] // empty
          ' <<< "${response}")"

          if [[ -z "${latest_tag}" ]]; then
            echo "::error::Could not find a stable CachyOS release tag"
            exit 1
          fi

          version_rel="${latest_tag#cachyos-}"
          version="${version_rel%-*}"
          tagrel="${version_rel##*-}"
          major_minor="$(cut -d. -f1,2 <<< "${version}")"
          patch="$(cut -d. -f3 <<< "${version}")"
          tarball_url="https://github.com/CachyOS/linux/releases/download/${latest_tag}/${latest_tag}.tar.gz"

          curl -fsI "${tarball_url}" >/dev/null

          echo "source_tag=${latest_tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tagrel=${tagrel}" >> "$GITHUB_OUTPUT"
          echo "major_minor=${major_minor}" >> "$GITHUB_OUTPUT"
          echo "patch=${patch}" >> "$GITHUB_OUTPUT"
          echo "tarball_url=${tarball_url}" >> "$GITHUB_OUTPUT"

          echo "Latest CachyOS stable source tag: ${latest_tag}"
          echo "Verified tarball: ${tarball_url}"

      - name: Check patch source availability
        id: patch_sources
        run: |
          set -euo pipefail

          major_minor="${{ steps.upstream.outputs.major_minor }}"
          bore_url="https://raw.githubusercontent.com/cachyos/kernel-patches/master/${major_minor}/sched/0001-bore-cachy.patch"
          openrgb_url="https://raw.githubusercontent.com/Frogging-Family/linux-tkg/master/linux-tkg-patches/${major_minor}/0014-OpenRGB.patch"
          dkms_url="https://raw.githubusercontent.com/cachyos/kernel-patches/master/${major_minor}/misc/dkms-clang.patch"

          status="ok"

          for url in "${bore_url}" "${openrgb_url}" "${dkms_url}"; do
            if curl -fsI "${url}" >/dev/null; then
              echo "Found: ${url}"
            else
              echo "::warning::Missing patch source: ${url}"
              status="missing"
            fi
          done

          echo "status=${status}" >> "$GITHUB_OUTPUT"

      - name: Compare current and upstream
        id: compare
        run: |
          set -euo pipefail

          current="${{ steps.current.outputs.source_tag }}"
          latest="${{ steps.upstream.outputs.source_tag }}"

          needs_update=false
          if [[ "${current}" != "${latest}" ]]; then
            newest="$(printf '%s\n%s\n' "${current#cachyos-}" "${latest#cachyos-}" | sort -V | tail -n1)"
            if [[ "${newest}" == "${latest#cachyos-}" ]]; then
              needs_update=true
            fi
          fi

          echo "needs_update=${needs_update}" >> "$GITHUB_OUTPUT"
          echo "Current: ${current}"
          echo "Latest:  ${latest}"
          echo "Needs update: ${needs_update}"

      - name: Summary
        run: |
          {
            echo "## Nightly CachyOS Upstream Check"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Current source tag | \`${{ steps.current.outputs.source_tag }}\` |"
            echo "| Latest CachyOS stable tag | \`${{ steps.upstream.outputs.source_tag }}\` |"
            echo "| Latest tarball | ${{ steps.upstream.outputs.tarball_url }} |"
            echo "| Patch source status | \`${{ steps.patch_sources.outputs.status }}\` |"
            echo "| Needs package update | \`${{ steps.compare.outputs.needs_update }}\` |"
            echo ""
            if [[ "${{ steps.compare.outputs.needs_update }}" == "true" ]]; then
              echo "A newer CachyOS source exists. Rebase patches and validate locally before tagging a linux-ghost release."
            else
              echo "linux-ghost is already tracking the latest CachyOS stable source tag."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when upstream update is available
        if: steps.compare.outputs.needs_update == 'true'
        run: |
          echo "::error::New CachyOS source tag available: ${{ steps.upstream.outputs.source_tag }}. Rebase and test before release."
          exit 1
