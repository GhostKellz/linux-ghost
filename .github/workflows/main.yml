name: Build Test

on:
  push:
    branches: [main, master]
    paths:
      - 'PKGBUILD'
      - 'config/**'
      - 'docs/**'
      - 'linux-ghost.install'
      - 'nvidia/**'
      - 'patches/**'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'SECURITY.md'
      - '.gitattributes'
      - '.github/workflows/**'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: self-hosted
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean workspace
        run: rm -rf src pkg *.tar.* 2>/dev/null || true

      - name: Show build configuration
        run: |
          source ./PKGBUILD
          echo "=== Build Configuration ==="
          echo "Kernel: ${_major}.${_minor}"
          echo "Scheduler: ${_cpusched}"
          echo "Compiler: ${_compiler}"
          echo "LTO: ${_lto_mode}"

      - name: Download sources and prepare
        run: makepkg -o --noconfirm --skipinteg
        env:
          _localmodcfg: "no"
          _nvidia_bundle: "no"
          _makenconfig: "no"

      - name: Verify patches applied
        run: |
          cd src/cachyos-*/
          echo "=== Applied Patches ==="
          if [[ -f .patches_applied ]]; then
            cat .patches_applied
          else
            echo "Checking git log for patches..."
            git log --oneline -20 2>/dev/null || echo "Not a git repo"
          fi

          echo ""
          echo "=== GHOST Scheduler Config ==="
          if ! grep -q '^CONFIG_SCHED_GHOST=y' .config; then
            echo "ERROR: CONFIG_SCHED_GHOST=y missing from generated .config" >&2
            grep -E 'CONFIG_SCHED_GHOST|CONFIG_GHOST_' .config >&2 || true
            exit 1
          fi
          grep -E 'CONFIG_SCHED_GHOST|CONFIG_GHOST_' .config

      - name: Compile kernel (full make all, LTO parity with release)
        run: |
          # Reuse the exact toolchain the PKGBUILD selects (LLVM full LTO by
          # default). Plain make would invoke GCC against a Clang/LTO .config and
          # fail, so source the PKGBUILD to pick up BUILD_FLAGS.
          # `make all` LTO-links vmlinux AND every in-tree module — the same
          # objects the release `makepkg -sf` builds — so green here means the
          # tag/release build will link.
          source ./PKGBUILD
          cd src/cachyos-*/
          echo "=== Starting full compile (flags: ${BUILD_FLAGS[*]:-none}) ==="
          make "${BUILD_FLAGS[@]}" olddefconfig
          make "${BUILD_FLAGS[@]}" -j$(nproc) all
          echo "=== Compile test PASSED ==="

      - name: Upload config
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-config-${{ github.sha }}
          path: src/cachyos-*/.config
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup
        if: always()
        run: rm -rf src pkg *.tar.* 2>/dev/null || true
